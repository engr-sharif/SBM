# The test matrix on GitHub's runners (v18 §4).
#
# Sixteen jobs in parallel put the whole matrix at roughly the length of its
# slowest step (v28: the desktop e2e is in shards — five per build since v44; it was one
# 30-40 minute job each), instead of the 40-70 minutes it takes queued behind ONE
# browser on the two-core cloud box. Each job runs the same runner an agent
# runs locally — test/run.mjs --only <step> — so there is one definition of
# what a step is, and the logs and screenshots come back as artifacts.
#
# COST: Actions is free while this repository is PUBLIC. This repository is
# private (site imagery and sample results for an active Superfund project —
# see CLAUDE.md "Sensitivity"), so every run spends Actions minutes from the
# account's allowance. That is why this runs on pull_request and on demand,
# never on every push. Trim `jobs` or use `workflow_dispatch` only if the
# allowance gets tight.
#
# The Pages deployment is untouched: it is configured in the repository's
# settings, not here, and this workflow never writes to a branch.

name: test matrix

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # the desktop e2e in six shards per build (test/run.mjs E2E_CUTS);
          # test/check.mjs fails if a shard here and a cut there disagree
          - step: e2e:folder:1
            also: split3d:folder
          - step: e2e:folder:2
            also: ""
          - step: e2e:folder:3
            also: ""
          - step: e2e:folder:4
            also: ""
          - step: e2e:folder:5
            also: ""
          - step: e2e:folder:6
            also: ""
          - step: e2e:dist:1
            also: split3d:dist
          - step: e2e:dist:2
            also: ""
          - step: e2e:dist:3
            also: ""
          - step: e2e:dist:4
            also: ""
          - step: e2e:dist:5
            also: ""
          - step: e2e:dist:6
            also: ""
          - step: field
            also: ""
          - step: tablet:file
            also: tablet:http
          - step: phone:http
            also: ""
          - step: perf
            also: audit,audit2
          - step: kernels
            also: touch_unit,tiles
          - step: terrain3d:folder
            also: terrain3d:dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package.json') }}

      - name: Install test dependencies
        working-directory: test
        run: npm install --no-audit --no-fund

      # The runner's package mirror sometimes takes 30-40 s to refuse each of
      # the nine font packages --with-deps installs, and a stalled apt-get used
      # to hold this step until the job's own 60-minute limit, before a single
      # test had started (2026-11-10, twice). So: apt gives up on a quiet
      # mirror after 12 s and tries the next one; the system packages are
      # installed under a time limit that runs AS ROOT (an unprivileged timeout
      # cannot stop the root apt-get, which then holds the dpkg lock against
      # every retry); and a failed attempt clears that lock before the next.
      #
      # 2026-11-11: the mirror did not answer AT ALL for twenty minutes and all
      # eighteen jobs failed here, three attempts each, with no test run. What
      # it could not fetch are nine FONT packages — the runner image already
      # carries every library Chromium links (apt says so, line by line). So a
      # mirror that will not answer no longer fails the job: after two
      # attempts the step asks the one question that matters, whether the
      # browser starts, and carries on if it does. The app ships its own
      # typefaces; if a missing system font ever matters to a test, that test
      # says so by name instead of the whole matrix going red.
      - name: Install Chromium
        working-directory: test
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "12";\nAcquire::https::Timeout "12";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          npx playwright install chromium
          for n in 1 2; do
            if sudo timeout -k 30 240 env "PATH=$PATH" npx playwright install-deps chromium; then exit 0; fi
            echo "playwright install-deps: attempt $n failed or timed out"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
            sleep 10
          done
          if node -e "require('playwright').chromium.launch().then(b => b.close()).then(() => process.exit(0), e => { console.error(String(e)); process.exit(1); })"; then
            echo "::warning::the package mirror did not answer; Chromium starts with what the runner image has, so the tests run without the extra font packages"
            exit 0
          fi
          echo "::error::the package mirror did not answer and Chromium does not start without the packages it serves"
          exit 1

      - name: Preflight
        run: node test/run.mjs --only check

      - name: Run the step
        run: |
          steps="${{ matrix.step }}${{ matrix.also && format(',{0}', matrix.also) || '' }}"
          echo "running: $steps"
          node test/run.mjs --only "$steps" --parallel 1

      - name: Job summary
        if: always()
        run: |
          {
            echo '### ${{ matrix.step }}'
            echo '```'
            tail -n 40 test/.logs/PROGRESS 2>/dev/null || echo 'no PROGRESS file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: test/.logs/
          if-no-files-found: ignore
          # .logs is a dot-directory: without this the step logs never upload
          include-hidden-files: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: test/shots/*.png
          if-no-files-found: ignore
